esphome:
  name: esphome-web-5073e8
  friendly_name: atlantis1
  min_version: 2026.4.0
  name_add_mac_suffix: false

  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: atlantis_leds
          brightness: 50%
          effect: Atlantis

esp32:
  variant: esp32
  framework:
    type: esp-idf

    
logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  
#################################################
# GLOBALS
#################################################

globals:
  - id: atlantis_state
    type: int
    restore_value: no
    initial_value: "0"

  - id: touch_baseline
    type: float
    restore_value: no
    initial_value: "0"

  - id: touch_energy
    type: float
    restore_value: no
    initial_value: "0"

  - id: touch_initialized
    type: bool
    restore_value: no
    initial_value: "false"

  - id: beacon_level
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: approach_level
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: pulse_level
    type: float
    restore_value: no
    initial_value: "0.0"
#################################################
# TOUCH
#################################################

esp32_touch:
  id: esp32_touch_hub
  setup_mode: true

binary_sensor:
  - platform: esp32_touch
    id: atlantis_touch
    pin: GPIO4
    threshold: 0

sensor:
  - platform: template
    id: atlantis_touch_raw
    name: "Atlantis Touch Raw"

    lambda: |-
      return id(atlantis_touch).get_value();

    update_interval: 20ms

    on_value:
      then:
        - lambda: |-
            
            float raw = id(atlantis_touch).get_value();

            // First Measurements
            if (!id(touch_initialized)) {

              // Ignore invalid initial values
              if (raw < 500) {
                ESP_LOGI("Atlantis",
                         "Waiting for valid touch value: %.0f",
                          raw);
                return;
              }

              id(touch_baseline) = raw;
              id(touch_initialized) = true;

              // Baseline initialized.
              // Wait for next measurement before processing.
              return;
            }
            float diff = id(touch_baseline) - raw;

            if (diff < 0)
              diff = 0;
            
            //--------------------------------------------------
            // Deadzone against sensor noise
            //--------------------------------------------------

            if (diff < 20)
              diff = 0;

            //--------------------------------------------------
            // Update baseline ONLY during idle.
            //--------------------------------------------------

            if (diff < 20) {
              id(touch_baseline) =
                  id(touch_baseline) * 0.999f +
                  raw * 0.001f;
            }

            //--------------------------------------------------
            // Target energy
            //--------------------------------------------------

            float energy = diff / 220.0f;

            if (energy > 1.0f)
              energy = 1.0f;

            //--------------------------------------------------
            // Load
            //--------------------------------------------------

            if (energy > id(touch_energy)) {

              id(touch_energy) =
                  id(touch_energy) * 0.45f +
                  energy * 0.55f;

            } else {

              //------------------------------------------------
              // Unload
              //------------------------------------------------

              id(touch_energy) =
                  id(touch_energy) * 0.88f +
                  energy * 0.12f;
            }
              
              
            //--------------------------------------------------
            // Almost Zero = Zero
            //--------------------------------------------------

            if (id(touch_energy) < 0.01f)
              id(touch_energy) = 0;


#################################################
# LEDS
#################################################

light:
  - platform: esp32_rmt_led_strip
    id: atlantis_leds
    name: "Atlantis1 LEDs"
    pin: GPIO18
    chipset: WS2812
    rgb_order: GRB
    num_leds: 6

    effects:
      - addressable_lambda:
          name: "Atlantis"
          update_interval: 30ms

          lambda: |-

            // Vorbereitung für zukünftige Animationen
            float beacon = id(beacon_level);
            float approach = id(approach_level);

            // Platzhalter für den späteren Renderer
            float final_brightness = 0.0f;

            // Bestehende Atlantis-Pulse-Logik (unverändert)
            float pulse_energy = id(touch_energy);

            // Midpoint between LEDs 2 and 3
            const float center_led = 2.5f;

            // How far the wave propagates
            float radius = pulse_energy * 3.5f;

            for (int i = 0; i < it.size(); i++) {

                float distance = fabsf(i - center_led);

                float brightness = radius - distance;

                if (brightness < 0.0f)
                    brightness = 0.0f;

                if (brightness > 1.0f)
                    brightness = 1.0f;

                uint8_t b = uint8_t(brightness * 255);

                it[i] = Color(0, b, b);
            }